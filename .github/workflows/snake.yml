name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"   # se actualiza todos los días a las 5am UTC
  workflow_dispatch: {}    # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar el SVG del snake
        uses: Platane/snk@v3
        with:
          github_user_name: JEILOV
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
